<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769c2"><title>Fuel Tracker</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fuel Tracker">
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18324f;background:#f2f6fc;font-size:16px;--green:#1769c2;--muted:#657b94}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #dc9d28;outline-offset:3px}header{max-width:1040px;margin:auto;padding:28px 24px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:25px;letter-spacing:-1px;margin:0}.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--green);color:white;border-radius:14px;width:44px;height:44px;display:grid;place-items:center;font-size:24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:0 0 4px}.chip{background:#e0ebfa;padding:8px 12px;border-radius:20px;font-size:13px}main{max-width:1040px;padding:12px 24px 110px;margin:auto}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #dfe7f2;display:flex;justify-content:center;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));z-index:3}nav button{border:0;background:transparent;padding:12px 24px;border-radius:14px;color:var(--muted);font-weight:600}nav button[aria-current=page]{color:var(--green);background:#e4effc}.panel{background:white;border:1px solid #e0e8f3;border-radius:22px;padding:24px;margin-bottom:18px}.card-top{display:flex;align-items:center;justify-content:space-between;gap:20px}.card-top img{max-width:100%;max-height:110px;object-fit:contain;background:white}.card-top button{background:white;border:0;width:100%}.card-placeholder{border:1px dashed #b3c9e5;background:#eaf1fb;text-align:center;padding:20px;border-radius:18px}.month{display:flex;align-items:center;justify-content:space-between;margin:24px 0 16px}.month h2{font-size:16px;margin:0;text-transform:capitalize}.icon{border:1px solid #dae4f2;background:white;border-radius:12px;padding:9px 15px}.budget{background:linear-gradient(120deg,#124785,#2881d8);color:white;border:0;padding:30px}.budget.over{background:linear-gradient(120deg,#862e2e,#b33c35)}.budget .amount{font-size:clamp(36px,7vw,64px);font-weight:750;letter-spacing:-2px;margin:12px 0}.budget p{margin:8px 0}.budget small{opacity:.8}.track{background:#ffffff35;height:7px;border-radius:8px;margin:20px 0 15px;overflow:hidden}.track span{display:block;height:100%;transition:width .3s,background-color .3s}.unit-price{background:#e8f0fc;border-radius:12px;padding:14px 16px;margin-top:16px;display:flex;justify-content:space-between;gap:12px}.unit-price output{font-weight:700}.split,.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stat{padding:22px;border-radius:18px;background:white;border:1px solid #e0e8f3}.stat-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#e4effc;color:#1769c2;margin-bottom:14px}.stat-icon svg{width:24px;height:24px}.stat small{color:var(--muted);display:block;margin-bottom:10px}.stat strong{font-size:23px;letter-spacing:-.7px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}h2{font-size:21px;letter-spacing:-.5px}h3{font-size:16px;margin:0 0 16px}.muted,.help{color:var(--muted);font-size:13px;line-height:1.6}.primary{background:var(--green);color:white;border:0;border-radius:13px;padding:13px 20px;font-weight:650}.secondary{background:#e8effa;color:#24558a;border:0;border-radius:12px;padding:12px 16px}.danger{background:#fceae5;color:#a03624;border:0;border-radius:12px;padding:10px 14px}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.entry{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid #edf1f7}.entry:last-child{border-bottom:0}.entry .badge{background:#e6f0fc;color:var(--green);border-radius:14px;padding:13px}.entry .details{flex:1;min-width:0}.entry strong,.entry small{display:block}.entry small{color:var(--muted);font-size:12px;line-height:1.8}.entry .cost{white-space:nowrap;font-weight:700}.entry .actions button{font-size:12px;padding:8px}.empty{text-align:center;padding:35px 10px;color:var(--muted)}label{font-size:14px;font-weight:550;display:block;margin:16px 0 7px}input,select{width:100%;border:1px solid #cbd8e9;background:#fbfcff;color:#183b64;border-radius:11px;padding:12px;min-width:0}input[type=checkbox]{width:auto;margin-right:10px}input[type=file]{font-size:13px}dialog{border:0;border-radius:24px;padding:26px;max-width:540px;width:calc(100% - 28px);max-height:90dvh;overflow:auto;color:#18324f;box-shadow:0 30px 100px #12365c40}dialog::backdrop{background:#10243e6b;backdrop-filter:blur(4px)}dialog h2{margin-top:0}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.error{color:#a03624;font-size:14px;line-height:1.5}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#183f70;color:white;padding:14px 22px;border-radius:14px;z-index:10;box-shadow:0 5px 30px #0002;max-width:90%;font-size:14px}#cardDialog{max-width:850px;background:white}#cardDialog img{width:100%;max-height:70dvh;object-fit:contain}.setting-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.setting-grid .panel{margin:0}.row{display:flex;gap:10px;align-items:center;margin-top:12px}.row input{flex:1}.car-row{display:flex;align-items:center;gap:8px;padding:13px 0;border-bottom:1px solid #edf1f7}.car-row span{flex:1;overflow-wrap:anywhere}[hidden]{display:none!important}.notice{padding:12px 16px;background:#fff4d9;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:18px}@media(min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:600px){header{padding:20px 18px 10px}main{padding:10px 18px 110px}.panel{padding:20px}.budget{padding:25px}.setting-grid{grid-template-columns:1fr}.entry{flex-wrap:wrap}.entry>.actions{width:100%;justify-content:flex-end}.stat{padding:17px}.stat strong{font-size:20px}nav button{padding:12px 15px}.chip{max-width:135px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo" aria-hidden="true">▥</div><div><p class="eyebrow">Twoje auto. Twoja kontrola.</p><h1>Fuel Tracker</h1></div></div><span class="chip" id="activeLabel">Brak samochodu</span></header>
<main><div id="storageWarning" class="notice" hidden></div><section id="home"></section><section id="settings" hidden></section></main>
<nav aria-label="Nawigacja"><button data-tab="home" aria-current="page">◷ Podsumowanie</button><button data-tab="settings">⚙ Ustawienia</button></nav>
<dialog id="entryDialog"><form id="entryForm"><h2 id="entryTitle">Nowy wpis</h2><label for="kind">Rodzaj wpisu</label><select id="kind"><option value="fuel">Tankowanie</option><option value="expense">Inny wydatek</option></select><label for="entryCar">Samochód</label><select id="entryCar" required></select><div class="split"><div><label for="date">Data</label><input id="date" type="date" required></div><div><label for="cost">Koszt (zł)</label><input id="cost" inputmode="decimal" placeholder="0,00" required></div></div><div id="fuelFields"><div class="split"><div><label for="km">Przebieg (km)</label><input id="km" inputmode="decimal" placeholder="np. 125000"></div><div><label for="liters">Liczba litrów</label><input id="liters" inputmode="decimal" placeholder="np. 42,5"></div></div><div class="unit-price"><span>Cena za litr</span><output id="unitPrice" for="cost liters" aria-live="polite">— zł/l</output></div><label><input id="full" type="checkbox" checked>Tankowanie do pełna</label><p class="help">Tankowania częściowe sumujemy do następnego pełnego baku.</p></div><div id="expenseFields" hidden><label for="category">Kategoria</label><select id="category"><option>Myjnia</option><option>Parking</option><option>Serwis</option><option>Ubezpieczenie</option><option>Inne</option></select></div><label for="note">Notatka (opcjonalnie)</label><input id="note" maxlength="1000"><p id="entryError" class="error" role="alert"></p><div class="form-actions"><button type="button" class="secondary" data-close="entryDialog">Anuluj</button><button class="primary" type="submit">Zapisz wpis</button></div></form></dialog>
<dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText" class="help"></p><div class="form-actions"><button class="secondary" data-close="confirmDialog">Anuluj</button><button id="confirmYes" class="danger">Potwierdź</button></div></dialog>
<dialog id="carDialog"><form id="carForm"><h2 id="carTitle">Dodaj samochód</h2><label for="carName">Nazwa samochodu</label><input id="carName" maxlength="80" required><div class="form-actions"><button type="button" class="secondary" data-close="carDialog">Anuluj</button><button class="primary">Zapisz</button></div></form></dialog>
<dialog id="cardDialog"><div class="actions" style="justify-content:flex-end"><button class="secondary" data-close="cardDialog">Zamknij</button></div><img id="cardLarge" alt="Kod karty lojalnościowej"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='fuel-tracker-v1';
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(n);
const num=(n,d=1)=>new Intl.NumberFormat('pl-PL',{maximumFractionDigits:d,minimumFractionDigits:d}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const monthOf=date=>date.slice(0,7);
const parse=s=>{s=String(s).trim().replace(/\s/g,'').replace(',','.');return /^\d+(\.\d+)?$/.test(s)?Number(s):NaN};
const uuid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const fresh=()=>({version:1,cars:[],entries:[],active:null,budget:1000,card:null});
let db=fresh(), writable=true, editing=null, editingCar=null, confirmAction=null, selectedMonth=monthOf(today()), tab='home', toastTimer;
function validate(v){
 if(!v||v.version!==1||!Array.isArray(v.cars)||!Array.isArray(v.entries)||!Number.isFinite(v.budget)||v.budget<0)throw Error('Nieobsługiwana lub niepoprawna kopia.');
 if(v.cars.some(c=>!c||typeof c.id!=='string'||typeof c.name!=='string'||!c.name.trim()||c.name.length>80))throw Error('Niepoprawne dane samochodu.');
 const ids=new Set(v.cars.map(c=>c.id));if(ids.size!==v.cars.length||!(v.active===null||ids.has(v.active)))throw Error('Niepoprawne powiązania samochodów.');
 if(!(v.card===null||(typeof v.card==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v.card))))throw Error('Niepoprawny obraz karty.');
 const eids=new Set();
 for(const e of v.entries){
  if(!e||typeof e.id!=='string'||eids.has(e.id)||!ids.has(e.carID)||!['fuel','expense'].includes(e.kind)||!Number.isFinite(e.cost)||e.cost<=0||typeof e.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!validDate(e.date)||typeof e.note!=='string'||e.note.length>1000||typeof e.category!=='string'||e.category.length>80)throw Error('Niepoprawny wpis w kopii.');
  eids.add(e.id);
  if(e.kind==='fuel'&&(!Number.isFinite(e.km)||e.km<0||!Number.isFinite(e.liters)||e.liters<=0||typeof e.full!=='boolean'))throw Error('Niepoprawne dane tankowania.');
 }
 for(const car of v.cars){const fuel=v.entries.filter(e=>e.carID===car.id&&e.kind==='fuel').sort((a,b)=>a.km-b.km);for(let i=1;i<fuel.length;i++)if(fuel[i].km<=fuel[i-1].km||fuel[i].date<fuel[i-1].date)throw Error('Przebiegi tankowań muszą rosnąć zgodnie z datami.');}
 return v;
}
function validDate(s){const d=new Date(s+'T12:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===s;}
try{const raw=localStorage.getItem(KEY);if(raw!==null)db=validate(JSON.parse(raw));}catch(e){writable=false;$('storageWarning').textContent='Nie można odczytać lokalnych danych. Zapis został zablokowany, aby ich nie nadpisać. Przywróć poprawną kopię w ustawieniach. '+e.message;$('storageWarning').hidden=false;}
function save(next,restore=false){
 try{if(!writable&&!restore)throw Error('Najpierw przywróć kopię danych.');validate(next);localStorage.setItem(KEY,JSON.stringify(next));db=next;writable=true;$('storageWarning').hidden=true;render();return true;}catch(e){toast('Nie zapisano: '+e.message+' Jeśli zabrakło miejsca, użyj mniejszego zdjęcia karty.');return false;}
}
const copy=()=>JSON.parse(JSON.stringify(db));
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,6500);}
function intervals(entries){let anchor=null,liters=0,result=[];for(const e of entries.filter(e=>e.kind==='fuel').sort((a,b)=>a.km-b.km)){if(anchor!==null){liters+=e.liters;if(e.full){if(e.km>anchor)result.push({km:e.km-anchor,liters,rate:liters/(e.km-anchor)*100});anchor=e.km;liters=0;}}else if(e.full)anchor=e.km;}return result;}
function activeEntries(){return db.entries.filter(e=>e.carID===db.active);}
function budgetColor(spent,budget){const ratio=budget>0?Math.max(0,Math.min(1,spent/budget)):spent>0?1:0;const green=[69,214,139],orange=[255,166,51],red=[255,85,85];const a=ratio<=0.5?green:orange,b=ratio<=0.5?orange:red,t=ratio<=0.5?ratio*2:(ratio-0.5)*2;return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`;}
const statIcons={
 'Paliwo w tym miesiącu':'<path d="M4 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17M2 21h14M7 7h4M14 11h2a2 2 0 0 1 2 2v4a2 2 0 0 0 4 0V8l-3-3M19 5v4h3"/>',
 'Inne wydatki w tym miesiącu':'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
 'Ostatnie spalanie':'<path d="M4 17a9 9 0 1 1 16 0M12 13l5-5M7 7l1 1M5 12h1M12 3v2M18 12h1"/><circle cx="12" cy="13" r="2"/>',
 'Średnie spalanie':'<path d="M4 19V5M4 19h17M8 15l4-5 4 2 5-7"/>',
 'Przejechany dystans':'<circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v6a3 3 0 0 0 3 3h6a3 3 0 0 0 0-6h-3M18 16v1"/>',
 'Zatankowane paliwo':'<path d="M12 3C10 7 5 11 5 15a7 7 0 0 0 14 0c0-4-5-8-7-12Z"/><path d="M8 15a4 4 0 0 0 4 4"/>'
};
function stat(label,value){return `<div class="stat"><span class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${statIcons[label]||''}</svg></span><small>${label}</small><strong>${value}</strong></div>`;}
function render(){
 $('activeLabel').textContent=db.cars.find(c=>c.id===db.active)?.name||'Brak samochodu';
 renderHome();renderSettings();
}
function renderHome(){
 const monthly=db.entries.filter(e=>monthOf(e.date)===selectedMonth),spent=monthly.reduce((s,e)=>s+e.cost,0),left=db.budget-spent;
 const fuel=monthly.filter(e=>e.kind==='fuel').reduce((s,e)=>s+e.cost,0),entries=activeEntries(),list=intervals(entries),kms=entries.filter(e=>e.kind==='fuel').map(e=>e.km);
 const totalKm=list.reduce((s,i)=>s+i.km,0),totalL=list.reduce((s,i)=>s+i.liters,0),distance=kms.length?Math.max(...kms)-Math.min(...kms):0;
 const monthName=new Date(selectedMonth+'-15T12:00:00').toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
 $('home').innerHTML=`${db.card?`<div class="panel card-top"><button id="showCard" aria-label="Powiększ kartę lojalnościową"><img src="${db.card}" alt="Karta lojalnościowa"><p class="help" style="margin:6px 0 0">KARTA LOJALNOŚCIOWA · DOTKNIJ, ABY POWIĘKSZYĆ</p></button></div>`:`<div class="card-placeholder"><span aria-hidden="true">▥</span> Twoja karta zawsze pod ręką<br><button class="secondary" id="addCardShortcut" style="margin-top:10px">Dodaj obraz karty</button></div>`}
 <div class="month"><button class="icon" id="prevMonth" aria-label="Poprzedni miesiąc">‹</button><h2>${monthName}</h2><button class="icon" id="nextMonth" aria-label="Następny miesiąc">›</button></div>
 <div class="panel budget ${left<0?'over':''}"><p>${left<0?'Przekroczono limit o':'Pozostało w limicie'}</p><div class="amount">${money(Math.abs(left))}</div><div class="track" role="progressbar" aria-label="Wykorzystanie budżetu" aria-valuemin="0" aria-valuemax="${Math.max(db.budget,spent,1)}" aria-valuenow="${spent}"><span style="background-color:${budgetColor(spent,db.budget)};width:${db.budget>0?Math.min(100,spent/db.budget*100):spent>0?100:0}%"></span></div><p>Wydano <b>${money(spent)}</b> z ${money(db.budget)}</p><small>Wspólny budżet wszystkich samochodów</small></div>
 <div class="split">${stat('Paliwo w tym miesiącu',money(fuel))}${stat('Inne wydatki w tym miesiącu',money(spent-fuel))}</div>
 <div class="section-head"><div><p class="eyebrow">Statystyki · cała historia</p><h2 style="margin:5px 0">${esc(db.cars.find(c=>c.id===db.active)?.name||'Twój pierwszy samochód')}</h2></div><button class="primary" id="homeAdd">＋ ${db.cars.length?'Dodaj wpis':'Dodaj auto'}</button></div>
 <div class="stats">${stat('Ostatnie spalanie',list.length?num(list.at(-1).rate)+' <small>l/100 km</small>':'—')}${stat('Średnie spalanie',list.length?num(totalL/totalKm*100)+' <small>l/100 km</small>':'—')}${stat('Przejechany dystans',num(distance,0)+' <small>km</small>')}${stat('Zatankowane paliwo',num(entries.filter(e=>e.kind==='fuel').reduce((s,e)=>s+e.liters,0))+' <small>litrów</small>')}</div>
 <p class="help">Spalanie liczymy pomiędzy tankowaniami do pełna, sumując tankowania częściowe. Średnia jest ważona dystansem. Dystans to różnica przebiegów z tankowań. Inne wydatki zmieniają wyłącznie budżet.</p><section id="history" aria-label="Historia wydatków"></section>`;
 $('prevMonth').onclick=()=>shiftMonth(-1);$('nextMonth').onclick=()=>shiftMonth(1);$('homeAdd').onclick=()=>db.cars.length?openEntry():openCar();
 renderHistory();
 if(db.card)$('showCard').onclick=()=>{$('cardLarge').src=db.card;$('cardDialog').showModal();};else $('addCardShortcut').onclick=()=>switchTab('settings');
}
function shiftMonth(n){const d=new Date(selectedMonth+'-15T12:00:00');d.setMonth(d.getMonth()+n);selectedMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderHome();}
function renderHistory(){
 const entries=activeEntries().sort((a,b)=>b.date.localeCompare(a.date)||(b.km||0)-(a.km||0));
 $('history').innerHTML=`<div class="section-head"><div><p class="eyebrow">${esc(db.cars.find(c=>c.id===db.active)?.name||'Brak samochodu')}</p><h2 style="margin:4px 0">Historia wydatków</h2></div><button class="primary" id="historyAdd">＋ Dodaj wpis</button></div><div class="panel">${entries.length?entries.map(e=>`<article class="entry"><div class="badge" aria-hidden="true">${e.kind==='fuel'?'▥':'◈'}</div><div class="details"><strong>${esc(e.kind==='fuel'?'Tankowanie':e.category)}</strong><small>${new Date(e.date+'T12:00:00').toLocaleDateString('pl-PL')}${e.kind==='fuel'?` · ${num(e.liters)} l · ${num(e.km,0)} km<br>${e.full?'Do pełna':'Tankowanie częściowe'}`:''}</small>${e.note?`<small>${esc(e.note)}</small>`:''}</div><div class="cost">${money(e.cost)}</div><div class="actions"><button class="secondary" data-edit="${esc(e.id)}">Edytuj</button><button class="danger" data-delete="${esc(e.id)}">Usuń</button></div></article>`).join(''):'<div class="empty">Jeszcze bez wpisów.<br>Dodaj tankowanie lub inny wydatek.</div>'}</div>`;
 $('historyAdd').onclick=()=>db.cars.length?openEntry():openCar();
 $('history').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEntry(b.dataset.edit));
 $('history').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>confirm('Usunąć wpis?','Budżet i statystyki zostaną przeliczone. Tej operacji nie można cofnąć.',()=>{const next=copy();next.entries=next.entries.filter(e=>e.id!==b.dataset.delete);if(save(next))toast('Usunięto wpis.');}));
}
function renderSettings(){
 $('settings').innerHTML=`<div class="section-head"><div><p class="eyebrow">Wszystko pod kontrolą</p><h2 style="margin:4px 0">Ustawienia</h2></div><span class="chip">Tryb offline</span></div><div class="setting-grid">
 <div class="panel"><h3>Miesięczny budżet</h3><label for="budgetInput">Limit wspólny dla wszystkich aut (zł)</label><div class="row"><input id="budgetInput" inputmode="decimal" value="${db.budget}"><button id="saveBudget" class="primary">Zapisz</button></div><p class="help">Jeden limit obowiązuje w każdym miesiącu. Zmiana aktualizuje również widok poprzednich miesięcy.</p></div>
 <div class="panel"><h3>Twoje samochody</h3>${db.cars.length?`<label for="activeCar">Aktywny samochód</label><select id="activeCar">${db.cars.map(c=>`<option value="${esc(c.id)}" ${c.id===db.active?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:'<p class="help">Dodaj pierwszy samochód, aby zacząć.</p>'}${db.cars.map(c=>`<div class="car-row"><span>${esc(c.name)}</span><button class="secondary" data-car-edit="${esc(c.id)}" aria-label="Edytuj ${esc(c.name)}">Edytuj</button><button class="danger" data-car-delete="${esc(c.id)}" aria-label="Usuń ${esc(c.name)}">Usuń</button></div>`).join('')}<button id="addCar" class="secondary" style="margin-top:16px">＋ Dodaj samochód</button></div>
 <div class="panel"><h3>Karta lojalnościowa</h3><p class="help">Zdjęcie kodu pojawi się na samej górze podsumowania. Wybierz wyraźny obraz zapisany na urządzeniu.</p><label for="cardInput">${db.card?'Zmień obraz':'Dodaj obraz kodu kreskowego'}</label><input type="file" id="cardInput" accept="image/jpeg,image/png,image/webp">${db.card?'<button class="danger" id="removeCard" style="margin-top:14px">Usuń obraz karty</button>':''}</div>
 <div class="panel"><h3>Eksport i import danych</h3><p class="help">Kopia zawiera samochody, wszystkie wpisy, limit i obraz karty. Import zastępuje dane po potwierdzeniu.</p><div class="actions"><button class="primary" id="exportData">↓ Eksportuj dane</button><button class="secondary" id="importData">↑ Importuj dane</button></div><input id="importInput" type="file" accept=".json,application/json" hidden><p class="help">Przed importem zapisz kopię obecnych danych. Plik możesz przenieść na inne urządzenie.</p></div></div>
 <div class="panel" style="margin-top:18px"><h3>Twoje dane zostają u Ciebie</h3><p class="help">Aplikacja nie łączy się z serwerem. Dane są zapisywane w pamięci tej przeglądarki. Korzystaj stale z tej samej przeglądarki i lokalizacji pliku. Tryb prywatny, czyszczenie danych przeglądarki lub przeniesienie HTML może spowodować utratę dostępu do zapisów. Regularnie eksportuj kopię. Plik kopii nie jest szyfrowany.</p></div>`;
 $('saveBudget').onclick=()=>{const value=parse($('budgetInput').value);if(!Number.isFinite(value)||value<0)return toast('Podaj poprawny limit nie mniejszy od zera.');const next=copy();next.budget=value;if(save(next))toast('Zapisano miesięczny limit.');};
 if($('activeCar'))$('activeCar').onchange=e=>{const next=copy();next.active=e.target.value;save(next);};
 $('addCar').onclick=()=>openCar();
 $('settings').querySelectorAll('[data-car-edit]').forEach(b=>b.onclick=()=>openCar(b.dataset.carEdit));
 $('settings').querySelectorAll('[data-car-delete]').forEach(b=>b.onclick=()=>confirm('Usunąć samochód?','Usuniemy także wszystkie wpisy tego auta. Zmieni to historię wydatków i budżet.',()=>{const next=copy(),id=b.dataset.carDelete;next.cars=next.cars.filter(c=>c.id!==id);next.entries=next.entries.filter(e=>e.carID!==id);if(next.active===id)next.active=next.cars[0]?.id||null;save(next);}));
 $('cardInput').onchange=loadCard;if($('removeCard'))$('removeCard').onclick=()=>{const next=copy();next.card=null;save(next);};
 $('exportData').onclick=exportData;$('importData').onclick=()=>$('importInput').click();$('importInput').onchange=importData;
}
function switchTab(name){tab=name;for(const name of ['home','settings'])$(name).hidden=name!==tab;document.querySelectorAll('[data-tab]').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});window.scrollTo(0,0);}
function openEntry(id=null){
 const e=db.entries.find(e=>e.id===id);editing=e?.id||null;$('entryForm').reset();$('entryTitle').textContent=e?'Edytuj wpis':'Nowy wpis';$('entryError').textContent='';
 $('entryCar').innerHTML=db.cars.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');$('entryCar').value=e?.carID||db.active;
 $('kind').value=e?.kind||'fuel';$('date').value=e?.date||today();$('cost').value=e?.cost??'';$('km').value=e?.km??'';$('liters').value=e?.liters??'';$('full').checked=e?.full??true;$('category').value=e?.category||'Myjnia';$('note').value=e?.note||'';toggleKind();$('entryDialog').showModal();
}
function updateUnitPrice(){const cost=parse($('cost').value),liters=parse($('liters').value),price=cost/liters;$('unitPrice').textContent=Number.isFinite(price)&&cost>0&&liters>0?money(price)+'/l':'— zł/l';}
$('cost').addEventListener('input',updateUnitPrice);$('liters').addEventListener('input',updateUnitPrice);
function toggleKind(){updateUnitPrice();const fuel=$('kind').value==='fuel';$('fuelFields').hidden=!fuel;$('expenseFields').hidden=fuel;$('km').required=fuel;$('liters').required=fuel;}
$('kind').onchange=toggleKind;
$('entryForm').onsubmit=e=>{e.preventDefault();
 const fuel=$('kind').value==='fuel',cost=parse($('cost').value),km=parse($('km').value),liters=parse($('liters').value);
 if(!Number.isFinite(cost)||cost<=0){$('entryError').textContent='Koszt musi być liczbą większą od zera.';return;}
 if(fuel&&(!Number.isFinite(km)||km<0||!Number.isFinite(liters)||liters<=0)){$('entryError').textContent='Podaj poprawny przebieg i liczbę litrów większą od zera.';return;}
 const next=copy(),value={id:editing||uuid(),carID:$('entryCar').value,date:$('date').value,cost,kind:fuel?'fuel':'expense',km:fuel?km:null,liters:fuel?liters:null,full:fuel&&$('full').checked,category:fuel?'Paliwo':$('category').value,note:$('note').value.trim()};
 next.entries=next.entries.filter(i=>i.id!==value.id);next.entries.push(value);
 try{validate(next);}catch(err){$('entryError').textContent=err.message;return;}
 if(save(next)){$('entryDialog').close();toast(editing?'Zapisano zmiany.':'Dodano wpis.');}
};
function openCar(id=null){editingCar=id;$('carTitle').textContent=id?'Edytuj samochód':'Dodaj samochód';$('carName').value=db.cars.find(c=>c.id===id)?.name||'';$('carDialog').showModal();}
$('carForm').onsubmit=e=>{e.preventDefault();const name=$('carName').value.trim();if(!name)return;const next=copy();if(editingCar)next.cars.find(c=>c.id===editingCar).name=name;else{const car={id:uuid(),name};next.cars.push(car);next.active=car.id;}if(save(next)){$('carDialog').close();toast('Zapisano samochód.');}};
function confirm(title,text,action){$('confirmTitle').textContent=title;$('confirmText').textContent=text;confirmAction=action;$('confirmDialog').showModal();}
$('confirmYes').onclick=()=>{$('confirmDialog').close();confirmAction?.();confirmAction=null;};
async function loadCard(e){const file=e.target.files[0];if(!file)return;try{
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Wybierz obraz JPG, PNG lub WebP.');if(file.size>15000000)throw Error('Wybierz zdjęcie mniejsze niż 15 MB.');
 const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
 const img=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('Nie można odczytać obrazu.'));img.src=raw;});
 const scale=Math.min(1,1800/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
 const next=copy();next.card=canvas.toDataURL('image/jpeg',.95);if(save(next))toast('Zapisano obraz karty.');
 }catch(err){toast(err.message||'Nie udało się odczytać obrazu.');}}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FuelTracker-kopia-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function importData(e){const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>15000000)throw Error('Kopia przekracza limit 15 MB.');const next=validate(JSON.parse(await file.text()));if(next.card)await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(Error('Uszkodzony obraz karty.'));img.src=next.card;});confirm('Zastąpić wszystkie dane?',`Kopia zawiera ${next.cars.length} samochodów i ${next.entries.length} wpisów. Obecne dane zostaną zastąpione. Przed importem warto je wyeksportować.`,()=>{if(save(next,true))toast('Przywrócono dane z kopii.');});}catch(err){toast('Nie zaimportowano: '+err.message);}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
window.addEventListener('storage',e=>{if(e.key===KEY){try{if(e.newValue===null)throw Error('Dane usunięto w innym oknie. Odśwież aplikację.');db=validate(JSON.parse(e.newValue));render();toast('Dane zaktualizowano z innego okna.');}catch(err){writable=false;$('storageWarning').textContent=err.message;$('storageWarning').hidden=false;}}});
render();
</script>
<script src="./pwa.js"></script></body>
</html>
